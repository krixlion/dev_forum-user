name: Run integration tests on Kind cluster

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Kind Cluster
        uses: helm/kind-action@v1.10.0
            
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build and load Docker image to Kind
        run: |
          docker build -t dev_forum-user:latest deployment/Dockerfile
          kind load docker-image dev_forum-user:latest

      - name: Run tests
        run: |
          make k8s-integration-test args="timeout=3s"
